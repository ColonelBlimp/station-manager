version: '3'

dotenv: ['.env']

includes:
  wails:
    taskfile: ./Taskfile.wails.yml

vars:
  SNAP_VERSION: '{{.SNAP_VERSION | default "dev-local"}}'

tasks:
  default:
    desc: "Sync Go workspace"
    cmds:
      - go work sync

  build:
    desc: "Build all modules"
    cmds:
      - |
        mkdir -p build/bin
        # Build the consolidated internal module
        echo "Compiling internal/..."
        (cd internal && go build ./...)
        # Build apps and cmd modules
        for mod in apps/* cmd/*; do
          if [ -f "${mod}/go.mod" ]; then
            # Skip Wails apps — they are built via 'task wails'
            if [ -f "${mod}/wails.json" ]; then
              echo "SKIP (Wails app) ${mod}"
              continue
            fi
            # Build binary for main packages, otherwise just compile-check
            if grep -rq '^package main' "${mod}"/*.go 2>/dev/null; then
              BINNAME=$(basename "$mod")
              echo "Building ${mod} -> build/bin/${BINNAME}"
              (cd "$mod" && go build -o "../../build/bin/${BINNAME}" .)
            else
              echo "Compiling ${mod}..."
              (cd "$mod" && go build ./...)
            fi
          fi
        done

  test:
    desc: "Run all tests (short)"
    cmds:
      - |
        echo "Testing internal/..."
        (cd internal && go test -race ./... -short)
        for mod in apps/* cmd/*; do
          if [ -f "${mod}/go.mod" ]; then
            echo "Testing ${mod}..."
            (cd "$mod" && go test -race ./... -short)
          fi
        done

  update:
    desc: "Update dependencies for all modules"
    cmds:
      - |
        echo "Updating internal/..."
        (cd internal && go get -u ./... && go mod tidy)
        for mod in apps/* cmd/*; do
          if [ -f "${mod}/go.mod" ]; then
            echo "Updating ${mod}..."
            (cd "$mod" && go get -u ./... && go mod tidy)
          fi
        done

  tidy:
    desc: "Run go mod tidy on all modules"
    cmds:
      - |
        echo "Tidying internal/..."
        (cd internal && go mod tidy)
        for mod in apps/* cmd/*; do
          if [ -f "${mod}/go.mod" ]; then
            echo "Tidying ${mod}..."
            (cd "$mod" && go mod tidy)
          fi
        done

  setup-hooks:
    desc: "Install Git pre-commit hook"
    cmds:
      - cp scripts/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
    status:
      - diff -q scripts/pre-commit .git/hooks/pre-commit

  # ── Snap (local dev) ───────────────────────────────────────────
  snap:dev:
    desc: "Build and install snap locally for testing"
    cmds:
      - task: wails
        vars:
          APP_VERSION: '{{.SNAP_VERSION}}'
      - task: snap:stage
      - task: snap:build
      - task: snap:install

  snap:stage:
    desc: "Copy binaries to repo root for snapcraft"
    cmds:
      - cp build/bin/smlogger build/bin/smbook .
      - chmod +x smlogger smbook
      - echo "Staged binaries:" && ls -lh smlogger smbook
    preconditions:
      - test -f build/bin/smlogger
      - test -f build/bin/smbook

  snap:build:
    desc: "Build the snap package locally (uses LXD managed build)"
    cmds:
      - |
        VERSION="{{.SNAP_VERSION}}"
        sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml
        echo "Building snap version: ${VERSION}"
      - snapcraft pack --use-lxd
    preconditions:
      - test -f smlogger
      - test -f smbook

  snap:install:
    desc: "Install the locally built snap (devmode)"
    cmds:
      - sudo snap install station-manager_*.snap --devmode --dangerous
    preconditions:
      - sh: ls station-manager_*.snap 2>/dev/null
        msg: "No .snap file found — run 'task snap:build' first"

  snap:remove:
    desc: "Remove the locally installed snap"
    cmds:
      - sudo snap remove station-manager

  snap:clean:
    desc: "Remove staged binaries and snap artifacts"
    cmds:
      - rm -f smlogger smbook
      - rm -f station-manager_*.snap
      - git checkout snap/snapcraft.yaml
      - echo "Cleaned snap staging files"
