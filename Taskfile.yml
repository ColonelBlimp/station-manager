version: '3'

dotenv: ['.env']

vars:
  # Build version derived from git (v2.* tags, via scripts/version.sh) so
  # `task`-built and `task run` daemons carry the same semver as the RPM
  # builds — feeds cmd/smd main.Version → User-Agent + ADIF PROGRAMVERSION.
  SM_VERSION:
    sh: bash -c '. scripts/version.sh && sm_git_version'
  # Container runtime for the smcloud dev Postgres. Defaults to podman (Fedora-
  # native, rootless); override with `PG_RUNTIME=docker task db:pg:up`.
  PG_RUNTIME: '{{default "podman" .PG_RUNTIME}}'

tasks:
  default:
    desc: Run vet, build, and test — the CI-equivalent local smoke check
    deps: [vet, build, test]

  vet:
    desc: Run go vet over the whole module
    cmds:
      - go vet ./...

  build:
    desc: Compile the whole module and build the daemon binary (CGO on → live FT8 capture)
    cmds:
      - CGO_ENABLED=1 go build ./...
      - CGO_ENABLED=1 go build -tags dev -ldflags="-X main.Version={{.SM_VERSION}}" -o build/bin/smd ./cmd/smd

  # --- SM Cloud P1 (ADR 0040) — dev Postgres + sqlboiler codegen -------------
  # Workflow: `task db:pg:up && task migrate:cloud:up && task models:cloud`.
  # CLI tools (install once):
  #   sqlboiler + psql driver: go install github.com/aarondl/sqlboiler/v4@latest
  #                            go install github.com/aarondl/sqlboiler/v4/drivers/sqlboiler-psql@latest
  #   golang-migrate:          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
  db:pg:up:
    desc: Start a local Postgres for smcloud codegen + integration tests ({{.PG_RUNTIME}}; user/pass/db = smcloud)
    cmds:
      # Fully-qualified image: podman's short-name resolution needs a TTY to
      # prompt for a registry, which a `task` run has not — so `postgres:16`
      # fails with "short-name resolution enforced but cannot prompt". docker
      # accepts the qualified name unchanged.
      - '{{.PG_RUNTIME}} run -d --name sm-pg -e POSTGRES_USER=smcloud -e POSTGRES_PASSWORD=smcloud -e POSTGRES_DB=smcloud -p 5432:5432 docker.io/library/postgres:16'
      - 'until {{.PG_RUNTIME}} exec sm-pg pg_isready -U smcloud >/dev/null 2>&1; do sleep 0.5; done'

  db:pg:down:
    desc: Stop + remove the local smcloud Postgres
    cmds:
      - '{{.PG_RUNTIME}} rm -f sm-pg'

  migrate:cloud:up:
    desc: Apply smcloud Postgres migrations to the local dev DB (needs the golang-migrate CLI)
    cmds:
      - migrate -path internal/cloud/store/migrations -database "postgres://smcloud:smcloud@localhost:5432/smcloud?sslmode=disable" up

  models:cloud:
    desc: Regenerate smcloud sqlboiler models from the migrated dev Postgres (read-only artifacts)
    dir: internal/cloud/store
    cmds:
      - sqlboiler psql

  frontend:logging:install:
    desc: Install logging-SPA dependencies; uses `npm ci` if a lockfile is present, else `npm install` (first run generates the lockfile)
    dir: frontend/logging
    cmds:
      - sh -c 'if [ -f package-lock.json ]; then npm ci; else npm install; fi'

  frontend:install:
    desc: Install dependencies for every embedded SPA (logging + config + logbook + app)
    deps: [frontend:logging:install, frontend:config:install, frontend:logbook:install, frontend:app:install]

  frontend:dev:
    desc: Run the logging SPA Vite dev server with HMR (proxies /v1/* to daemon on :8080)
    dir: frontend/logging
    cmds:
      - npm run dev

  frontend:build:
    desc: Production build of the logging SPA (consumed by go:embed)
    dir: frontend/logging
    cmds:
      - npm run build

  frontend:deps:check:
    desc: List logging-SPA npm dependencies that are behind their latest published version (in-range and major bumps both)
    dir: frontend/logging
    cmds:
      - npm run deps:check

  frontend:deps:update:
    desc: Pull in-range npm dependency bumps for the logging SPA (anything compatible with the package.json semver ranges). Major bumps stay deliberate — `npm install <pkg>@latest` per their own commit.
    dir: frontend/logging
    cmds:
      - npm run deps:update

  frontend:config:install:
    desc: Install config-SPA dependencies; uses `npm ci` if a lockfile is present, else `npm install` (first run generates the lockfile)
    dir: frontend/config
    cmds:
      - sh -c 'if [ -f package-lock.json ]; then npm ci; else npm install; fi'

  frontend:config:dev:
    desc: Run the config SPA Vite dev server with HMR on :5174 (proxies /v1/* to daemon on :8080; runs alongside frontend:dev)
    dir: frontend/config
    cmds:
      - npm run dev

  frontend:config:build:
    desc: Production build of the config SPA (consumed by go:embed)
    dir: frontend/config
    cmds:
      - npm run build

  frontend:logbook:install:
    desc: Install logbook-SPA dependencies; uses `npm ci` if a lockfile is present, else `npm install` (first run generates the lockfile)
    dir: frontend/logbook
    cmds:
      - sh -c 'if [ -f package-lock.json ]; then npm ci; else npm install; fi'

  frontend:logbook:dev:
    desc: Run the logbook SPA Vite dev server with HMR on :5175 (proxies /v1/* to daemon on :8080; runs alongside frontend:dev)
    dir: frontend/logbook
    cmds:
      - npm run dev

  frontend:logbook:build:
    desc: Production build of the logbook SPA (consumed by go:embed)
    dir: frontend/logbook
    cmds:
      - npm run build

  frontend:app:install:
    desc: Install app-SPA dependencies (the consolidated shell, ADR 0044); `npm ci` if a lockfile is present, else `npm install`
    dir: frontend/app
    cmds:
      - sh -c 'if [ -f package-lock.json ]; then npm ci; else npm install; fi'

  frontend:app:dev:
    desc: Run the consolidated app SPA (ADR 0044) Vite dev server with HMR on :5176 (proxies /v1/* to daemon on :8080; runs alongside the other frontend:*:dev servers)
    dir: frontend/app
    cmds:
      - npm run dev

  frontend:app:build:
    desc: Production build of the consolidated app SPA (ADR 0044); embedded by the daemon and served at /app/.
    dir: frontend/app
    cmds:
      - npm run build

  frontend:app:check:
    desc: Type-check the consolidated app SPA (svelte-check)
    dir: frontend/app
    cmds:
      - npm run check

  frontend:build:all:
    desc: Build every embedded SPA (logging + config + logbook + app). The build:smd* tasks depend on this so the daemon embeds fresh bundles for all clients.
    deps: [frontend:build, frontend:config:build, frontend:logbook:build, frontend:app:build]

  manual:build:
    desc: Build the operator manual (Hugo → manual/public/) for the daemon's go:embed. Single self-contained zero-JS page (ADR 0036).
    dir: manual
    cmds:
      - hugo --quiet

  manual:serve:
    desc: Preview the operator manual with live reload on http://localhost:1313 while writing content. Dev-only; not the embedded build.
    dir: manual
    cmds:
      - hugo server --buildDrafts

  build:smd:
    desc: |
      Build the daemon with a freshly built embedded SPA. CGO on (live FT8
      capture; dynamically linked against core glibc) — the default dev build.
      For the static CGO-free shape (headless/aggregator + the shipped-release
      shape) use build:smd:static; for faster decode use build:smd:pocketfft.
    deps: [frontend:build:all, manual:build]
    cmds:
      - CGO_ENABLED=1 go build -tags dev -ldflags="-X main.Version={{.SM_VERSION}}" -o build/bin/smd ./cmd/smd

  build:smd:static:
    desc: |
      Build the daemon (embedded SPA) CGO-free + static — pure-Go gonum FFT, no
      audio capture, so the FT8 subsystem stays idle. This is the shipped-release
      shape (matches release-rpm.sh's CGO_ENABLED=0 default) and the right build
      for a headless / network-only aggregator node.
    deps: [frontend:build:all, manual:build]
    cmds:
      - CGO_ENABLED=0 go build -ldflags="-X main.Version={{.SM_VERSION}}" -o build/bin/smd ./cmd/smd

  build:smd:pocketfft:
    desc: |
      Build the daemon with the PocketFFT (CGO) FFT backend instead of the
      default pure-Go gonum one — ~2x faster FT8 decode, but dynamically
      linked (needs a C toolchain). The backend is go-ft8's //go:build pocketfft
      gate. build:smd is also CGO now (live capture) but uses the gonum FFT;
      this task swaps in the faster PocketFFT FFT. build:smd:static is the
      CGO-free shape.
    deps: [frontend:build:all, manual:build]
    cmds:
      - CGO_ENABLED=1 go build -tags "dev pocketfft" -ldflags="-X main.Version={{.SM_VERSION}}" -o build/bin/smd ./cmd/smd

  build:smcloud:
    desc: |
      Build the SM Cloud backup service (cmd/smcloud) as a fully STATIC
      linux binary — pure Go throughout (lib/pq + golang-migrate, no CGO),
      so the one file scp's to any Linux box with zero runtime deps.
      Default amd64; SMCLOUD_ARCH=arm64 task build:smcloud for a Pi-class
      LAN staging box. Output: build/bin/smcloud. Runbook: docs/smcloud-deploy.md.
    vars:
      SMCLOUD_ARCH: '{{default "amd64" .SMCLOUD_ARCH}}'
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.SMCLOUD_ARCH}} go build -trimpath -ldflags="-s -w -X main.Version={{.SM_VERSION}}" -o build/bin/smcloud ./cmd/smcloud

  rpm:dev:
    desc: |
      Build a development RPM ready for local install. Output:
      build/release/station-manager-dev.x86_64.rpm. Internal version
      string is "dev" (also injected as cmd/smd's Version → daemon
      User-Agent and ADIF PROGRAMVERSION). For a one-command
      build→install→restart, use `task deploy:local:dev` instead.
      CGO-free/static by default; for the PocketFFT (CGO) variant use
      rpm:dev:pocketfft.
    cmds:
      - scripts/dev-rpm.sh

  rpm:dev:pocketfft:
    desc: |
      Like rpm:dev but builds the PocketFFT (CGO) backend by setting
      SM_FFT=pocketfft. Dynamically linked, ~2x faster decode, needs gcc.
      Standalone RPM only (no install/restart) — the one-command dogfood
      deploy `task deploy:local:dev` already defaults to this backend.
    cmds:
      - SM_FFT=pocketfft scripts/dev-rpm.sh

  deploy:local:dev:
    desc: |
      One-command local-dogfood update: builds the dev RPM, stops the
      user-level smd daemon (if running), reinstalls the RPM via
      `sudo rpm -Uvh --replacepkgs` (handles the same-NVR case the
      "dev" version string forces), runs systemd daemon-reload, and
      starts smd back up. Final step checks systemctl is-active and
      points you at journalctl on failure. Sudo prompts for the
      package install only — systemctl commands run as your user.
      Defaults to the PocketFFT (CGO) backend so live FT8 capture + decode
      work out of the box (the pure-Go static build leaves FT8 idle —
      capture needs CGO). For the static CGO-free build instead, override
      with: SM_FFT=gonum task deploy:local:dev.
    cmds:
      - bash scripts/deploy-local-dev.sh

  reset:local:dev:
    desc: |
      Fully UNINSTALL the local dogfood install — leave the system as if Station
      Manager had never been installed. The inverse of deploy:local:dev:
      disable + stop the smd user service (systemctl --user disable --now),
      disable user lingering (loginctl disable-linger), remove the package
      (sudo dnf remove station-manager — drops the binary + systemd unit), then
      DELETE the working dir (~/.local/share/station-manager: config.json + QSO
      database + logs). DESTRUCTIVE + needs sudo — prompts to confirm
      (SM_RESET_YES=1 to skip). Re-install with `task deploy:local:dev`.
    interactive: true
    cmds:
      - bash scripts/reset-local-dev.sh

  test:
    desc: Run tests with race detector and -short
    cmds:
      - go test -race -short ./...

  test:qrz-live:
    desc: |
      Run the manual QRZ.com live-integration test (quick round-trip,
      no pauses). Requires QRZ_TEST_API_KEY and QRZ_TEST_CALLSIGN in
      .env (for the operator's test logbook). Makes real HTTP calls
      to QRZ and cleans up the test record via an in-test DELETE.
    cmds:
      - go test -v -count=1 -tags manual -run TestLive_InsertThenUpdate ./internal/forwarding/qrz/...

  test:qrz-live-interactive:
    desc: |
      Interactive QRZ.com live flow: INSERT → pause → UPDATE → pause →
      DELETE, pausing after each operation so you can verify the
      record on QRZ.com's website between steps. Requires
      QRZ_TEST_API_KEY and QRZ_TEST_CALLSIGN in .env. Ctrl+C between
      steps leaves the record in the logbook.
    interactive: true
    cmds:
      - go test -v -count=1 -tags manual -run TestLive_InteractiveFlow ./internal/forwarding/qrz/...

  run:
    desc: Build and run the daemon using SM_WORKING_DIR from .env
    deps: [build]
    cmds:
      # Stop the systemd smd first so the two daemons don't fight over :8080.
      # Tolerant: no-op if it isn't running / the unit isn't installed.
      - echo "stopping systemd smd (if running) to free :8080 - restart it later with systemctl --user start smd"
      - systemctl --user stop smd 2>/dev/null || true
      - ./build/bin/smd

  run:smd:
    desc: |
      Run the daemon directly via `go run` for SPA development. Pair with
      `task frontend:dev` in another terminal — Vite serves the SPA on :5173
      and proxies /v1/* to this daemon. Uses SM_WORKING_DIR from .env.
      CGO on, so live FT8 capture works without a deploy — the fast FT8
      iteration loop (no RPM). Automatically stops the systemd `smd` first so
      the two don't contend for :8080 / the audio + serial ports; restart the
      dogfood daemon afterwards with `systemctl --user start smd`.
    cmds:
      # Free :8080 + the audio/serial ports: a running systemd smd would
      # otherwise collide with this dev daemon (the "address already in use"
      # restart flap). Tolerant of not-running / unit-not-installed.
      - echo "stopping systemd smd (if running) to free :8080 - restart it later with systemctl --user start smd"
      - systemctl --user stop smd 2>/dev/null || true
      - CGO_ENABLED=1 go run -tags dev -ldflags="-X main.Version={{.SM_VERSION}}" ./cmd/smd

  tag:
    desc: |
      Create an annotated release tag, guarded: refuses unless the working
      tree is clean (git status --porcelain) and the tag doesn't already
      exist; validates vMAJOR.MINOR.PATCH[-prerelease]. Does NOT push.
      Usage: task tag -- v2.0.0-alpha.2 ["message"]
    cmds:
      - bash scripts/tag.sh {{.CLI_ARGS}}

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  ci:lint:
    desc: |
      Static analysis of .github/workflows/*.yml via actionlint —
      catches YAML typos, bad action versions, shell-script smell
      inside `run:` blocks. Install once with:
        go install github.com/rhysd/actionlint/cmd/actionlint@latest
    cmds:
      - actionlint

  ci:local:
    desc: |
      Local mirror of .github/workflows/ci.yml — runs every gate the
      "releasability" CI job runs (SPA lint/type-check/test/build, Go
      gofmt/vet/race-test, daemon embed-build). Answers "would CI pass
      right now?" without pushing. Set SKIP_NPM_CI=1 to reuse existing
      node_modules during tight iteration.
    cmds:
      - bash scripts/ci-local.sh

  ci:
    desc: |
      Full CI check — actionlint over the workflow YAML, then the
      local mirror of the workflow itself. Use before pushing when
      you've touched anything that could affect releasability.
    deps: [ci:lint, ci:local]
