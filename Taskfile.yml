version: '3'

dotenv: ['.env']

includes:
  wails:
    taskfile: ./Taskfile.wails.yml


tasks:
  default:
    desc: "Sync Go workspace"
    cmds:
      - go work sync

  build:
    desc: "Build all modules"
    cmds:
      - |
        mkdir -p build/bin
        # Build the consolidated internal module
        echo "Compiling internal/..."
        (cd internal && go build ./...)
        # Build apps and cmd modules
        for mod in apps/* cmd/*; do
          if [ -f "${mod}/go.mod" ]; then
            # Skip Wails apps — they are built via 'task wails'
            if [ -f "${mod}/wails.json" ]; then
              echo "SKIP (Wails app) ${mod}"
              continue
            fi
            # Build binary for main packages, otherwise just compile-check
            if grep -rq '^package main' "${mod}"/*.go 2>/dev/null; then
              BINNAME=$(basename "$mod")
              echo "Building ${mod} -> build/bin/${BINNAME}"
              (cd "$mod" && go build -o "../../build/bin/${BINNAME}" .)
            else
              echo "Compiling ${mod}..."
              (cd "$mod" && go build ./...)
            fi
          fi
        done

  test:
    desc: "Run all tests (short)"
    cmds:
      - |
        echo "Testing internal/..."
        (cd internal && go test -race ./... -short)
        for mod in apps/* cmd/*; do
          if [ -f "${mod}/go.mod" ]; then
            # Skip Wails apps — they require a frontend build
            if [ -f "${mod}/wails.json" ]; then
              echo "SKIP (Wails app) ${mod}"
              continue
            fi
            echo "Testing ${mod}..."
            (cd "$mod" && go test -race ./... -short)
          fi
        done

  update:
    desc: "Update dependencies for all modules"
    cmds:
      - |
        echo "Updating internal/..."
        (cd internal && go get -u ./... && go mod tidy)
        for mod in apps/* cmd/*; do
          if [ -f "${mod}/go.mod" ]; then
            echo "Updating ${mod}..."
            (cd "$mod" && go get -u ./... && go mod tidy)
          fi
        done

  tidy:
    desc: "Run go mod tidy on all modules"
    cmds:
      - |
        echo "Tidying internal/..."
        (cd internal && go mod tidy)
        for mod in apps/* cmd/*; do
          if [ -f "${mod}/go.mod" ]; then
            echo "Tidying ${mod}..."
            (cd "$mod" && go mod tidy)
          fi
        done

  ft8:
    desc: "Build the FT8 RX/TX CLI tool → build/bin/ft8"
    cmds:
      - mkdir -p build/bin
      - cd cmd/ft8 && go build -o ../../build/bin/ft8 .
    sources:
      - cmd/ft8/**/*.go
      - internal/**/*.go

  setup-hooks:
    desc: "Install Git pre-commit hook"
    cmds:
      - cp scripts/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
    status:
      - diff -q scripts/pre-commit .git/hooks/pre-commit

  # ── Local release simulation ────────────────────────────────
  release:local:
    desc: "Simulate the full CI release pipeline locally"
    vars:
      TAG: '{{.TAG | default "0.0.0-local"}}'
    cmds:
      - task: release:validate
      - task: build
      - task: wails:default
        vars:
          APP_VERSION: '{{.TAG}}'
      - task: release:stage
        vars:
          TAG: '{{.TAG}}'

  release:validate:
    desc: "Run the same checks as CI validate (vet, fmt, test, lint)"
    cmds:
      - echo "── go vet ──"
      - |
        set -eo pipefail
        while IFS= read -r mod; do
          if [ -f "$mod/wails.json" ]; then
            echo "==> SKIP (Wails app) ./$mod"
            continue
          fi
          echo "==> go vet ./$mod"
          (cd "$mod" && go vet ./...)
        done < <(find apps internal cmd -name go.mod -printf '%h\n' | sort)
      - echo "── gofmt ──"
      - |
        UNFORMATTED=$(git ls-files '*.go' | xargs gofmt -l)
        if [ -n "$UNFORMATTED" ]; then
          echo "❌ Go format violations:"
          echo "$UNFORMATTED"
          exit 1
        fi
        echo "✓ All files properly formatted"
      - echo "── tests ──"
      - |
        set -eo pipefail
        while IFS= read -r mod; do
          if [ -f "$mod/wails.json" ]; then
            echo "==> SKIP (Wails app) ./$mod"
            continue
          fi
          echo "==> go test -race ./... -short in ./$mod"
          (cd "$mod" && go test -race ./... -short)
        done < <(find apps internal cmd -name go.mod -printf '%h\n' | sort)
      - echo "── lint ──"
      - |
        export PATH="$(go env GOPATH)/bin:$PATH"
        if ! command -v golangci-lint &>/dev/null; then
          echo "⚠ golangci-lint not found — skipping lint"
          exit 0
        fi
        set -eo pipefail
        echo "==> golangci-lint ./internal"
        (cd internal && golangci-lint run --timeout=5m ./...)
        while IFS= read -r mod; do
          if [ -f "$mod/wails.json" ]; then
            echo "==> SKIP (Wails app) ./$mod"
            continue
          fi
          echo "==> golangci-lint ./$mod"
          (cd "$mod" && golangci-lint run --timeout=5m ./...)
        done < <(find apps cmd -name go.mod -printf '%h\n' | sort)

  release:stage:
    desc: "Collect release artifacts and build packages into build/release/"
    vars:
      TAG: '{{.TAG | default "0.0.0-local"}}'
    cmds:
      - |
        set -e
        rm -rf build/release
        mkdir -p build/release
        for bin in build/bin/*; do
          [ -f "$bin" ] || continue
          name=$(basename "$bin")
          [ "$name" = ".gitkeep" ] && continue
          cp "$bin" "build/release/${name}"
          echo "  → build/release/${name}"
        done
      - task: package:deb
        vars:
          TAG: '{{.TAG}}'
      - task: package:rpm
        vars:
          TAG: '{{.TAG}}'
      - |
        echo ""
        echo "✅ Local release staged (tag={{.TAG}}):"
        ls -lh build/release/

  # ── nfpm packaging ─────────────────────────────────────────
  package:deb:
    desc: "Build .deb package via nfpm"
    vars:
      TAG: '{{.TAG | default "0.0.0-local"}}'
    cmds:
      - mkdir -p build/release
      - VERSION={{.TAG}} nfpm pkg -f nfpm.yaml -p deb -t build/release/

  package:rpm:
    desc: "Build .rpm package via nfpm"
    vars:
      TAG: '{{.TAG | default "0.0.0-local"}}'
    cmds:
      - mkdir -p build/release
      - VERSION={{.TAG}} nfpm pkg -f nfpm.yaml -p rpm -t build/release/

