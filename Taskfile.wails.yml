version: '3'

vars:
  APP_VERSION: '{{.APP_VERSION | default (env "APP_VERSION") | default "dev"}}'
  GIT_SHORT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  VERSION: '{{if eq .APP_VERSION "dev"}}dev-{{.GIT_SHORT}}{{else}}{{.APP_VERSION}}{{end}}'

tasks:
  default:
    desc: "Build all Wails applications"
    cmds:
      - task: logging
        vars:
          APP_VERSION: '{{.VERSION}}'
      - task: logbook
        vars:
          APP_VERSION: '{{.VERSION}}'
      - task: config
        vars:
          APP_VERSION: '{{.VERSION}}'

  # ── Shared Utils ─────────────────────────────────────────────
  shared-utils:dep-install:
    desc: "Install shared-utils dependencies"
    dir: web/shared-utils
    cmds:
      - npm install
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  shared-utils:build:
    desc: "Build shared-utils"
    dir: web/shared-utils
    deps:
      - shared-utils:dep-install
    cmds:
      - npm run build
    sources:
      - src/**/*
    generates:
      - dist/index.js

  # ── Logging ──────────────────────────────────────────────────
  logging:
    desc: "Build the logging application"
    cmds:
      - task: shared-utils:build
      - task: logging:frontend-dep-install
      - task: logging:wails-build
        vars:
          APP_VERSION: '{{.APP_VERSION | default $.VERSION}}'

  logging:frontend-dep-install:
    desc: "Install frontend dependencies for apps/logging"
    dir: apps/logging/frontend
    cmds:
      - npm install
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  logging:frontend-build:
    desc: "Build the logging frontend"
    dir: apps/logging/frontend
    cmds:
      - npm run build
    sources:
      - src/**/*
    generates:
      - build/index.html

  logging:wails-build:
    desc: "Build the logging Wails binary"
    dir: apps/logging
    cmds:
      - wails build -tags webkit2_41 -ldflags "-X main.version={{.APP_VERSION}}"

  logging:dev:
    desc: "Run the logging app in Wails dev mode (hot-reload)"
    deps:
      - shared-utils:build
      - logging:frontend-dep-install
    dir: apps/logging
    cmds:
      - wails dev -tags webkit2_41

  # ── Logbook ──────────────────────────────────────────────────
  logbook:
    desc: "Build the logbook application"
    cmds:
      - task: shared-utils:build
      - task: logbook:frontend-dep-install
      - task: logbook:wails-build
        vars:
          APP_VERSION: '{{.APP_VERSION | default $.VERSION}}'

  logbook:frontend-dep-install:
    desc: "Install frontend dependencies for apps/logbook"
    dir: apps/logbook/frontend
    cmds:
      - npm install
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  logbook:frontend-build:
    desc: "Build the logbook frontend"
    dir: apps/logbook/frontend
    cmds:
      - npm run build
    sources:
      - src/**/*
    generates:
      - build/index.html

  logbook:wails-build:
    desc: "Build the logbook Wails binary"
    dir: apps/logbook
    cmds:
      - wails build -tags webkit2_41 -ldflags "-X main.version={{.APP_VERSION}}"

  logbook:dev:
    desc: "Run the logbook app in Wails dev mode (hot-reload)"
    deps:
      - shared-utils:build
      - logbook:frontend-dep-install
    dir: apps/logbook
    cmds:
      - wails dev -tags webkit2_41

  # ── Config ───────────────────────────────────────────────────
  config:
    desc: "Build the config application"
    cmds:
      - task: shared-utils:build
      - task: config:frontend-dep-install
      - task: config:wails-build
        vars:
          APP_VERSION: '{{.APP_VERSION | default $.VERSION}}'

  config:frontend-dep-install:
    desc: "Install frontend dependencies for apps/config"
    dir: apps/config/frontend
    cmds:
      - npm install
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  config:frontend-build:
    desc: "Build the config frontend"
    dir: apps/config/frontend
    cmds:
      - npm run build
    sources:
      - src/**/*
    generates:
      - build/index.html

  config:wails-build:
    desc: "Build the config Wails binary"
    dir: apps/config
    cmds:
      - wails build -tags webkit2_41 -ldflags "-X main.version={{.APP_VERSION}}"

  config:dev:
    desc: "Run the config app in Wails dev mode (hot-reload)"
    deps:
      - shared-utils:build
      - config:frontend-dep-install
    dir: apps/config
    cmds:
      - wails dev -tags webkit2_41

  frontend-update:
    desc: "Update npm dependencies for all frontends"
    cmds:
      - echo "Updating web/shared-utils..."
      - cmd: bash -c 'cd web/shared-utils && npm update'
      - echo "Updating apps/logging/frontend..."
      - cmd: bash -c 'cd apps/logging/frontend && npm update'
      - echo "Updating apps/logbook/frontend..."
      - cmd: bash -c 'cd apps/logbook/frontend && npm update'
      - echo "Updating apps/config/frontend..."
      - cmd: bash -c 'cd apps/config/frontend && npm update'
      - echo "✓ All frontend dependencies updated"

