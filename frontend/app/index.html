<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Station Manager</title>
    <!-- Set the theme + nav-collapse attributes before paint so there's no
         flash. The Svelte app keeps them in sync afterwards (App.svelte). -->
    <script>
      (function () {
        var t = localStorage.getItem('sm-theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.nav =
          localStorage.getItem('sm-nav') === 'narrow' ? 'narrow' : 'full';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
