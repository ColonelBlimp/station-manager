# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
#
# Station Manager v2 RPM spec.
#
# The v2 daemon is a single statically-linked Go binary that serves the
# browser SPA embedded inside it. No GUI toolkit dependencies — the
# operator's browser is the UI. Compare against v1's nfpm.yaml on the
# v1 branch (three Wails binaries, GTK + WebKit depends, desktop +
# icon + XDG menu files) to see what the v2 package no longer needs.
#
# Build via scripts/release-rpm.sh, which sets VERSION and invokes
# nfpm. The package name is intentionally identical to v1 so
# `dnf install station-manager-<v2>.rpm` replaces the v1 install.

name: station-manager
arch: amd64
platform: linux
version: "${VERSION}"
maintainer: "ColonelBlimp"
description: "Amateur Radio QSO logger daemon (smd) — single-binary HTTP service serving an embedded browser SPA"
homepage: "https://github.com/ColonelBlimp/station-manager"
license: "GPL-3.0-only"

contents:
  - src: build/bin/smd
    dst: /usr/bin/smd
    file_info:
      mode: 0755

  # Operator-facing control wrapper: `smctl start|stop|restart|status`.
  # Prints a confirmed "SM Started." / "SM Stopped." line that bare
  # `systemctl --user … smd` cannot (systemctl is silent on success and
  # unit output goes to the journal, not the invoking terminal).
  - src: scripts/smctl.sh
    dst: /usr/bin/smctl
    file_info:
      mode: 0755

  - src: packaging/smd.service
    dst: /usr/lib/systemd/user/smd.service
    file_info:
      mode: 0644

  # Operator manual, on disk. The same static site the daemon serves at
  # /manual is also installed here so it's readable from a browser via
  # file:// when the daemon won't start — the troubleshooting moment docs
  # are most needed (ADR 0036). Built by Hugo into manual/public/ before
  # packaging (release.sh on the host; dev-rpm.sh / release-rpm.sh otherwise).
  - src: manual/public/
    dst: /usr/share/doc/station-manager/manual/

# No postinstall scriptlet. An RPM scriptlet runs as root and so
# can't `systemctl --user enable`, `loginctl enable-linger`, or do
# anything else that needs the operator's session — those are the
# only actions worth taking. Echoing instructions during `dnf
# install` is just noise; docs/install.md is the canonical setup
# guide.
