name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build non-Wails apps
        run: |
          set -eo pipefail
          mkdir -p build/bin
          while IFS= read -r mod; do
            # Skip Wails apps for now: they need a frontend build first
            if [ -f "$mod/wails.json" ]; then
              echo "==> SKIP (Wails app) ./$mod"
              continue
            fi
            # Only build modules that contain a main package
            if ! grep -rq '^package main' "$mod"/*.go 2>/dev/null; then
              echo "==> SKIP (library) ./$mod"
              continue
            fi
            BINNAME=$(basename "$mod")
            echo "==> Building ./$mod -> build/bin/${BINNAME}"
            (cd "$mod" && go build -o "../../build/bin/${BINNAME}" .)
          done < <(find apps cmd -name go.mod -printf '%h\n' | sort)

      - name: Verify binaries
        run: |
          echo "Built artifacts:"
          ls -lh build/bin/
          file build/bin/*

      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries-linux-amd64
          path: build/bin/*
          retention-days: 14

  wails-apps:
    name: Build Wails Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Derive version
        id: version
        run: |
          # Use git tag if available, otherwise short SHA
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-${GITHUB_SHA::7}")
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Build Wails apps
        run: task wails:logging APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Verify binaries
        run: |
          echo "Built Wails artifacts:"
          ls -lh build/bin/
          file build/bin/smlogger

      - uses: actions/upload-artifact@v4
        with:
          name: wails-apps-linux-amd64
          path: build/bin/smlogger
          retention-days: 14

