name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Run go vet in each module
        run: |
          set -eo pipefail
          while IFS= read -r mod; do
            # Skip Wails apps: their go:embed requires a frontend build
            if [ -f "$mod/wails.json" ]; then
              echo "==> SKIP (Wails app) ./$mod"
              continue
            fi
            echo "==> go vet ./$mod"
            (cd "$mod" && go vet ./...)
          done < <(find apps internal cmd -name go.mod -printf '%h\n' | sort)

  fmt:
    name: Go Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Check tracked Go files with gofmt
        run: |
          UNFORMATTED=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Go format violations found:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✓ All files properly formatted"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests in each module
        run: |
          set -eo pipefail
          while IFS= read -r mod; do
            # Skip Wails apps: their go:embed requires a frontend build
            if [ -f "$mod/wails.json" ]; then
              echo "==> SKIP (Wails app) ./$mod"
              continue
            fi
            echo "==> go test -race ./... -short in ./$mod"
            (cd "$mod" && go test -race ./... -short)
          done < <(find apps internal cmd -name go.mod -printf '%h\n' | sort)

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Run golangci-lint in each module
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          set -eo pipefail
          echo "==> golangci-lint ./internal"
          (cd internal && golangci-lint run --timeout=5m ./...)
          while IFS= read -r mod; do
            # Skip Wails apps: their go:embed requires a frontend build
            if [ -f "$mod/wails.json" ]; then
              echo "==> SKIP (Wails app) ./$mod"
              continue
            fi
            echo "==> golangci-lint ./$mod"
            (cd "$mod" && golangci-lint run --timeout=5m ./...)
          done < <(find apps cmd -name go.mod -printf '%h\n' | sort)
