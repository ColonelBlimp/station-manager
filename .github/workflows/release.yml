name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go vet
        run: |
          set -eo pipefail
          while IFS= read -r mod; do
            if [ -f "$mod/wails.json" ]; then
              echo "==> SKIP (Wails app) ./$mod"
              continue
            fi
            echo "==> go vet ./$mod"
            (cd "$mod" && go vet ./...)
          done < <(find apps internal cmd -name go.mod -printf '%h\n' | sort)

      - name: Go format check
        run: |
          UNFORMATTED=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Go format violations found:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✓ All files properly formatted"

      - name: Unit tests
        run: |
          set -eo pipefail
          while IFS= read -r mod; do
            if [ -f "$mod/wails.json" ]; then
              echo "==> SKIP (Wails app) ./$mod"
              continue
            fi
            echo "==> go test -race ./... -short in ./$mod"
            (cd "$mod" && go test -race ./... -short)
          done < <(find apps internal cmd -name go.mod -printf '%h\n' | sort)

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          set -eo pipefail
          while IFS= read -r mod; do
            if [ -f "$mod/wails.json" ]; then
              echo "==> SKIP (Wails app) ./$mod"
              continue
            fi
            echo "==> golangci-lint ./$mod"
            (cd "$mod" && golangci-lint run --timeout=5m ./...)
          done < <(find apps internal cmd -name go.mod -printf '%h\n' | sort)

  build-wails:
    name: Build Wails Apps
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Build Wails apps
        run: task wails APP_VERSION=${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: wails-apps-linux-amd64
          path: |
            build/bin/smlogger
            build/bin/smbook
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-wails
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wails-apps-linux-amd64
          path: artifacts/wails-apps

      - name: List release assets
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/wails-apps/*
