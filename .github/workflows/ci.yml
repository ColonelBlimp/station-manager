name: CI

# Continuous Delivery gate (NOT Continuous Deployment): every push to main
# answers the question "if I tagged this commit right now, would the
# release artifact be sound?" Releases themselves are operator-driven
# (`git tag` + scripts/release-rpm.sh). Trunk-based workflow — there are
# no feature branches — so the gate must fire on every push to main.
#
# Failure modes the gate is designed to catch (see project memory
# `project_sm_cd_pipeline_planned`):
#
#   - SPA bundle stale relative to daemon embed (go:embed pulls dist/).
#   - SPA test / lint / svelte-check regression silently broke a
#     dogfooded screen.
#   - Go test / vet / fmt regression on any package.
#   - Daemon binary fails to build with the fresh SPA bundle embedded.
#
# Gates 4–8 from docs/v2-design/release-acceptance.md (install smoke,
# end-to-end QSO, bridge live test, etc.) need real hardware or a clean
# VM and stay manual for now; this workflow covers gates 1–3 + the
# SPA-test layer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same ref when a new push lands —
# rapid commits on main shouldn't queue up stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  releasability:
    name: Releasability gate
    runs-on: ubuntu-latest
    # Healthy full runs land at ~14-15m (3 SPA builds + Hugo + race tests + CGO
    # PocketFFT build + FT8 decode test), so a 15m cap was cancelling ~half of
    # them at the tail (FT8-decode / ClubLog-key boundary) and invalidating the
    # gate rather than bounding a hang. 25m kept a bound with headroom until the
    # race step itself outgrew 10m per package (2026-10-29: cmd/smd and the
    # uncached internal/database/sqlite timed out at 600s, internal/archive took
    # 504s); with the race step's per-package timeout at 20m, 45m leaves the
    # remaining checks room.
    timeout-minutes: 45

    # Dev Postgres for the smcloud store integration tests
    # (internal/cloud/store). Those tests skip-gate on a reachable DB (they ping
    # localhost:5432 and t.Skip when it is down), so without this service they
    # silently skip in CI and the reconcile invariants — the stale/tenant upsert
    # guards, µs modified_at canonicalisation, tombstone semantics — go
    # undefended. The tests self-apply the schema from migrations/, so no
    # migrate step is needed here; ports:5432 maps the service onto localhost,
    # which is the tests' default DSN (smcloud/smcloud/smcloud). Since 2026-08-10
    # those destructive tests refuse the default DSN without an explicit opt-in
    # (store.ResolveTestDSN), so the go-test steps below set
    # SMCLOUD_TEST_ALLOW_DEFAULT=1. That is safe HERE — and ONLY here — because
    # this service container is created fresh for the job and destroyed with it,
    # so it is disposable by construction. The local commands (`task test`,
    # scripts/ci-local.sh) deliberately do NOT set the opt-in: a dev box's
    # localhost:5432 may be a real/dogfood database, so those tests skip locally
    # unless the operator opts in by hand (codex round-3 P1 on 8fd6c7e5). Short
    # image name resolves fine — GitHub runners use Docker, not podman (cf.
    # Taskfile db:pg:up, which must fully-qualify it for rootless podman).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smcloud
          POSTGRES_PASSWORD: smcloud
          POSTGRES_DB: smcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smcloud"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Agent instruction context budget
        run: bash scripts/check-agent-context.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # actions/setup-go caches GOMODCACHE + GOCACHE automatically.

      - name: Documentation catalog
        run: go run ./cmd/docscatalog check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/app/package.json
          cache: npm
          cache-dependency-path: |
            frontend/app/package-lock.json
            desktop/package-lock.json

      # ─── SPA gate ───────────────────────────────────────────────
      # Run the SPA-side checks BEFORE the Go build so the daemon embed picks
      # up a fresh, verified dist/. Fast-fail order: lint and type-check are
      # cheapest, then tests, then build. The app SPA is the SOLE embedded
      # operator client — the logging (2026-07-21), config, and logbook
      # (2026-08-19) SPAs were retired (embeds + routes gone). See W-0003.

      # ─── App SPA gate ───────────────────────────────────────────
      # The consolidated app client (frontend/app/, ADR 0044) is a separate
      # embedded SPA served at /app/. Same lint → type-check → test → build order.

      - name: App SPA install
        working-directory: frontend/app
        run: npm ci

      - name: App SPA lint
        working-directory: frontend/app
        run: npm run lint

      - name: App SPA format check
        working-directory: frontend/app
        run: npm run format:check

      - name: App SPA type-check
        working-directory: frontend/app
        run: npx svelte-check --fail-on-warnings

      - name: App SPA tests
        working-directory: frontend/app
        run: npx vitest run

      # ─── Desktop shell gate (W-0027) ────────────────────────────
      # The Electron shell has its own manifest and lockfile. Its A1 scenario runs
      # against the built-in fixture harness only (never smd). Ubuntu 24.04 restricts
      # unprivileged user namespaces through AppArmor, which Chromium's sandbox needs;
      # lifting that restriction on the throwaway runner keeps the renderer sandbox ON
      # in the test instead of running Electron with --no-sandbox. The original value is
      # restored when the step ends, so later steps keep the runner's starting posture.
      - name: Desktop shell install
        working-directory: desktop
        run: npm ci

      - name: Desktop shell lint
        working-directory: desktop
        run: npm run lint

      - name: Desktop shell format check
        working-directory: desktop
        run: npm run format:check

      - name: Desktop shell unit tests (identity discovery and validation, synthetic files only)
        working-directory: desktop
        run: npm run test:unit

      - name: Desktop shell A1, C1 and C1d-shell scenarios (Electron, fixture harnesses)
        working-directory: desktop
        run: |
          orig=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$orig"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run check:a1
          xvfb-run -a npm run check:c1
          xvfb-run -a npm run check:c1d-shell
          xvfb-run -a npm run check:c2b

      # W-0027 D1: the desktop app RPM. nfpm is pinned; rpm, cpio, binutils and
      # desktop-file-utils read the artifact back. The build downloads Electron afresh and
      # verifies its pinned SHA-256; the check inspects the RPM itself (header, file list,
      # modes, extracted contents). A shallow checkout gives a SHA-only version, which is
      # enough: the check compares the package against the version computed here.
      # W-0027 D1 part 3: the production smoke check launches the RPM's runtime (installed
      # mode) once per development selector, and proves on isolated review copies, on this
      # runner, that a wrong or failing waiting page, sandbox: false and --no-sandbox each fail
      # (seccomp can be inherited from the environment, so a host-only proof is not enough).
      - name: Desktop app RPM (build, content check, production smoke check)
        run: |
          orig=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$orig"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q rpm cpio binutils desktop-file-utils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 -I scripts/desktop_rpm_check_test.py
          python3 -I scripts/desktop_rpm_guard_test.py
          python3 -I scripts/desktop_smoke_test.py
          scripts/desktop-rpm.sh
          . scripts/version.sh
          V=$(sm_git_version)
          python3 -I scripts/desktop-rpm-check.py build/release/station-manager-desktop.x86_64.rpm \
            --version "$(sm_rpm_version "$V")" --app-version "$V"
          python3 -I scripts/desktop-smoke.py build/release/station-manager-desktop.x86_64.rpm
          python3 -I scripts/desktop-smoke.py build/release/station-manager-desktop.x86_64.rpm --reversions

      - name: App SPA build (produces dist/ for daemon embed)
        working-directory: frontend/app
        run: npm run build

      # The operator manual is a static Hugo site embedded into the daemon
      # (manual/ → go:embed all:public). Build it so the daemon-build smoke
      # below compiles against the real page and a broken Hugo template or
      # content fails CI. Pinned binary download — no third-party action.
      - name: Install Hugo
        run: |
          HUGO_VERSION=0.162.1
          # Download to a file first, THEN extract: --retry can only recover a
          # partial transfer when curl owns a rewindable output (a pipe into tar
          # cannot be rewound, so a mid-stream failure would corrupt the stream).
          # A transient blip on this fetch red the whole gate once (2026-08-12;
          # the asset/version were fine).
          curl --retry 3 --retry-all-errors -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo

      - name: Manual build (produces public/ for daemon embed)
        working-directory: manual
        run: hugo --quiet

      # ─── Go gate ────────────────────────────────────────────────
      # gofmt is run as a check (-l lists files needing format; we
      # fail if the list is non-empty). vet + race-detector tests
      # next, then the daemon-build smoke that proves the SPA embed
      # actually compiles in.

      - name: gofmt check
        run: |
          drift=$(gofmt -l ./cmd/ ./internal/)
          if [ -n "$drift" ]; then
            echo "::error::gofmt drift detected:"
            echo "$drift"
            exit 1
          fi

      # `npm ci` (above) populates the SPAs' node_modules/ dirs, which
      # contain third-party packages shipping their own Go code (e.g.
      # flatted's Golang variant). Filter them out at each call site so
      # a broken npm dep with broken Go code can't fail our build for an
      # unrelated reason. The `$(...)` substitution runs in bash inside
      # the step, so word-splitting on the multi-line list works as
      # expected — unlike a `${{ steps.foo.outputs.bar }}` expansion,
      # which would inline the raw newlines into the shell command and
      # the shell would interpret each line after the first as its own
      # command. (Caught by CI run on first push of session 66.)
      - name: go vet
        run: go vet $(go list ./... | grep -v /node_modules/)

      # Maintainability metrics only (.golangci.yml): cognitive/cyclomatic
      # complexity, duplication, maintainability index. NOT correctness — the
      # correctness linters are a separate decision, and gofmt/vet/race already
      # run above.
      #
      # Version is PINNED and must match what the baseline was measured with;
      # .golangci.yml's thresholds and its exemption list were derived on 2.11.3,
      # and a different version can change the metrics under them. Bump both
      # together (see the header of .golangci.yml).
      #
      # Scope matches the baseline: ./cmd/... ./internal/... — the config's own
      # path rules drop generated sqlboiler models and npm-vendored Go.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: golangci-lint (maintainability gate)
        run: >-
          golangci-lint run --max-issues-per-linter=0 --max-same-issues=0
          --uniq-by-line=false ./cmd/... ./internal/...

      # The ordinary gate above catches new extreme outliers. This full diagnostic
      # pass also measures suppressed debt, publishes distribution/trend visibility,
      # and rejects growth behind an existing function or whole-file exemption.
      - name: Maintainability observatory
        env:
          MAINTAINABILITY_OUTPUT_DIR: /tmp/station-manager-maintainability
        run: bash scripts/maintainability-metrics.sh

      - name: Upload maintainability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainability-${{ github.sha }}
          path: |
            /tmp/station-manager-maintainability/report.json
            /tmp/station-manager-maintainability/summary.md
          retention-days: 30
          if-no-files-found: ignore

      # Race detector run in -short mode: catches data races in the
      # concurrency-bearing code (scheduler, ring, capture, services,
      # forwarder workers) fast. The slow full-pipeline FT8 decode tests
      # skip under -short — running a ~3-minute sequential CPU pipeline
      # under -race adds no race-detection value and used to blow the
      # 5-minute budget (and starve neighbouring packages' timing-
      # sensitive tests of CPU). Those decode tests run in the non-race
      # step below instead.
      #
      # This step is also where the internal/cloud/store integration tests
      # run for real — the `postgres` service above is what stops them
      # skip-gating; keep the service as long as those tests exist.
      #
      # -timeout is PER PACKAGE BINARY. internal/api previously reached 349–587s
      # under -race because each test server repeated database migrations. A
      # migrated template now keeps that package at 30s on CI (11s plain). The
      # heavy stress tests scale down under -short. 2026-10-29: cmd/smd and an
      # uncached internal/database/sqlite exceeded 10m, so the budget is 20m;
      # the W-0024 daemon tests stay in this step (admission, draining,
      # coordination and concurrent confirmation need the race detector).
      # Uncached measurement (run 40864387932): cmd/smd 504s, sqlite 459s,
      # archive 439s; the step took 9m56s.
      - name: go test (race detector, -short)
        env:
          SMCLOUD_TEST_ALLOW_DEFAULT: "1"
        run: go test -race -short -timeout 20m $(go list ./... | grep -v /node_modules/)

      # Full run without the race detector: exercises the slow FT8
      # decode sensitivity-floor tests (real-capture decodes, synthetic
      # round-trips) that -short skips above. Generous timeout — these
      # are CPU-heavy but ~7x faster than under -race.
      - name: go test (full, no race)
        env:
          SMCLOUD_TEST_ALLOW_DEFAULT: "1"
        run: go test -timeout 12m $(go list ./... | grep -v /node_modules/)

      # CGO_ENABLED=0 is explicit: ubuntu-latest ships gcc, so a bare `go build`
      # would link CGO and NOT exercise the shipped CGO-free/static shape. This
      # mirrors release-rpm.sh's default and is the releasability gate.
      - name: Build daemon, static (verifies SPA embed + shipped CGO-free shape)
        run: CGO_ENABLED=0 go build -o /tmp/smd ./cmd/smd

      # W-0027 C1d: the desktop shell against a REAL smd (the binary just built, with the SPA
      # embedded), in a temporary working directory with synthetic data and free loopback
      # ports; never a station. It needs the SPA and daemon builds above, so it runs here
      # rather than with the fixture scenarios. Same AppArmor handling as those.
      - name: Desktop shell C1d acceptance (Electron against a real smd)
        working-directory: desktop
        env:
          SM_DESKTOP_SMD: /tmp/smd
        run: |
          orig=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$orig"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run check:c1d
          # W-0027 C2b: the same acceptance with smd's operating-client check on.
          xvfb-run -a npm run check:c2b-smd
      # W-0027 C2c: the tools against that same binary with the check on, in a temporary
      # working directory with the rig, FT8 and evidence capture disabled. The client and
      # the Cabrillo reader only read; the tune probe is not executed here.
      - name: The operator's tools against a real smd with the check on
        env:
          SM_DESKTOP_SMD: /tmp/smd
        run: python3 -I scripts/smd_tools_smd_test.py

      - name: Build all cmd/ binaries (catcli, loadgen, etc.)
        run: go build ./cmd/...

      # ─── PocketFFT (CGO) opt-in backend ─────────────────────────
      # The static build above is the shipped default (pure-Go gonum FFT). The
      # opt-in PocketFFT backend (CGO, ~2x faster FT8 decode) is gated behind
      # go-ft8's `pocketfft` build tag + CGO_ENABLED=1, and is NOT the shipped
      # default. Building it with CGO also compiles the malgo audio-capture path
      # (`//go:build cgo`), so this step covers the live-FT8 CGO build too — it
      # can't silently rot. ubuntu-latest ships gcc.
      - name: Build daemon (PocketFFT/CGO backend)
        run: CGO_ENABLED=1 go build -tags pocketfft -o /tmp/smd-pocketfft ./cmd/smd

      - name: FT8 decode test (PocketFFT/CGO backend)
        run: CGO_ENABLED=1 go test -tags pocketfft ./internal/ft8/...

      # ─── ST-7 build boundary ────────────────────────────────────
      # The shared ClubLog application key must stay out of public/distributable
      # artifacts: the private build path bakes it, the public path refuses to build
      # with a key present, and the public binary carries none. This gate builds a
      # keyed and a keyless binary with a dummy sentinel and asserts the boundary.
      - name: Build boundary (ClubLog key stays out of public artifacts)
        run: bash scripts/test-build-boundary.sh

      # ─── The local deploy script ────────────────────────────────
      # scripts/deploy-local-dev.sh stops the station's daemon. Its tests run a
      # copy in a temporary directory with stand-ins for systemctl, sudo, rpm and
      # the build, and hold it to: every refusal is found before the stop, the
      # daemon and the desktop package are upgraded in one transaction, and a
      # failed install never leaves the daemon stopped.
      - name: Deploy script (the daemon is never left stopped)
        run: python3 -I scripts/deploy_local_dev_test.py
      # W-0027 C2c: the operator's own tools once smd's operating-client check is on. Each
      # verifies smd before it sends the install's credential. Synthetic installs and
      # identities, loopback fixtures that only record; no smd, no rig, nothing keyed. The
      # probe's tests first deny themselves every TCP connection (scripts/confined.py,
      # Landlock) and run the probe against a recording stand-in for the client command.
      # Where the kernel cannot do that they do not run, and this step fails.
      - name: The operator's tools (the verified client, the Cabrillo reader, the tune probe)
        run: |
          python3 -I scripts/smd_client_test.py
          python3 -I scripts/ukeicc_cabrillo_test.py
          python3 -I scripts/tune_probe_test.py
