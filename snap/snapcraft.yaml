name: station-manager
title: Station Manager – Amateur Radio Suite
base: core24
version: '2026.1'
summary: A suite of desktop apps for amateur radio operators
description: |
  Station Manager is a collection of Linux desktop applications for
  amateur radio operators. The suite includes a QSO logging app,
  a logbook viewer, a configuration tool, and CLI utilities.
  Built with Go, SvelteKit, and Wails.

grade: devel
confinement: strict

contact: marc@7q5mlv.net

# ── Environment ──────────────────────────────────────────────────
# SM_WORKING_DIR is read by utils.WorkingDir() in every app.
# $SNAP_USER_COMMON persists across snap refreshes.
#
# Runtime layout:
#   $SNAP_USER_COMMON/
#   ├── config.json
#   ├── db/data.db
#   └── logs/
#
# WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: WebKit2GTK runs its own
# seccomp-bpf sandbox which conflicts with snap's confinement,
# causing the WebView to silently crash (blank page). Disabling it
# is safe here because snap already provides sandboxing.
#
# WEBKIT_DISABLE_COMPOSITING_MODE: avoids GPU-compositing issues
# inside the snap's confined graphics stack.
environment:
  SM_WORKING_DIR: "$SNAP_USER_COMMON"
  WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
  WEBKIT_DISABLE_COMPOSITING_MODE: "1"

# ── Apps ─────────────────────────────────────────────────────────
# The gnome extension provides: GTK3/4 libraries, WebKit2GTK,
# fonts/fontconfig, GPU driver passthrough, theme integration,
# and proper WebKit subprocess paths — all from the gnome-46-2404
# content snap.  No manual stage-packages or layouts needed.
apps:
  sm-logger:
    extensions: [gnome]
    command: usr/bin/smlogger
    desktop: usr/share/applications/sm-logger.desktop
    plugs: &gui-plugs
      - network
      - home
      - serial-port
      - browser-support
      - opengl

  sm-logbook:
    extensions: [gnome]
    command: usr/bin/smbook
    desktop: usr/share/applications/sm-logbook.desktop
    plugs: *gui-plugs

# ── Parts ────────────────────────────────────────────────────────
parts:
  station-manager:
    plugin: dump
    source: .
    source-type: local
    organize:
      smlogger: usr/bin/smlogger
      smbook:   usr/bin/smbook
      snap/gui/sm-logger.desktop:  usr/share/applications/sm-logger.desktop
      snap/gui/sm-logbook.desktop: usr/share/applications/sm-logbook.desktop
      snap/gui/sm-logger.png:      usr/share/icons/sm-logger.png
      snap/gui/sm-logbook.png:     usr/share/icons/sm-logbook.png
    stage:
      - usr/bin/smlogger
      - usr/bin/smbook
      - usr/share/applications/*
      - usr/share/icons/*
    prime:
      - usr/bin/smlogger
      - usr/bin/smbook
      - usr/share/applications/*
      - usr/share/icons/*

  metainfo:
    plugin: dump
    source: snap/local
    organize:
      station-manager.metainfo.xml: usr/share/metainfo/station-manager.metainfo.xml
    prime:
      - usr/share/metainfo/station-manager.metainfo.xml

