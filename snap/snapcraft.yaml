name: station-manager
title: Station Manager – Amateur Radio Suite
base: core24
version: '2026.1'
summary: A suite of desktop apps for amateur radio operators
description: |
  Station Manager is a collection of Linux desktop applications for
  amateur radio operators. The suite includes a QSO logging app,
  a logbook viewer, a configuration tool, and CLI utilities.
  Built with Go, SvelteKit, and Wails.

grade: devel
confinement: devmode

contact: marc@7q5mlv.net

# ── Layout ───────────────────────────────────────────────────────
# WebKit2GTK has hardcoded absolute paths for its subprocess binaries
# (WebKitNetworkProcess, WebKitWebProcess, etc.).  The stage-packages
# install them at $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/ but
# the library looks for /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/ at
# runtime.  The layout makes the snap's copy visible at that path.
layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1

# ── Environment ──────────────────────────────────────────────────
# SM_WORKING_DIR is read by utils.WorkingDir() in every app.
# $SNAP_USER_COMMON persists across snap refreshes.
#
# Runtime layout:
#   $SNAP_USER_COMMON/
#   ├── config.json
#   ├── db/data.db
#   └── logs/
environment:
  SM_WORKING_DIR: "$SNAP_USER_COMMON"

# ── Apps ─────────────────────────────────────────────────────────
# Desktop files live in snap/gui/<app>.desktop and are picked up
# automatically by snapcraft.  Icons are snap/gui/<app>.png.
apps:
  sm-logger:
    command: usr/bin/smlogger
    desktop: snap/gui/sm-logger.desktop
    plugs: &gui-plugs
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network
      - home

  sm-logbook:
    command: usr/bin/smbook
    desktop: snap/gui/sm-logbook.desktop
    plugs: *gui-plugs

# ── Parts ────────────────────────────────────────────────────────
parts:
  station-manager:
    plugin: dump
    source: .
    source-type: local
    organize:
      smlogger: usr/bin/smlogger
      smbook:   usr/bin/smbook
    stage-packages:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libjavascriptcoregtk-4.1-0

  metainfo:
    plugin: dump
    source: snap/local
    organize:
      station-manager.metainfo.xml: usr/share/metainfo/station-manager.metainfo.xml

